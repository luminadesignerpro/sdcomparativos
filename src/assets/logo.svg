<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>

  <!-- Subtle border -->
  <rect width="200" height="200" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Glow orb top-left -->
  <circle cx="20" cy="20" r="50" fill="#f59e0b" opacity="0.04"/>
  <!-- Glow orb bottom-right -->
  <circle cx="180" cy="185" r="60" fill="#d97706" opacity="0.06"/>

  <!-- Chart bars (background decoration) -->
  <rect x="22" y="130" width="12" height="30" rx="3" fill="#f59e0b" opacity="0.12"/>
  <rect x="38" y="118" width="12" height="42" rx="3" fill="#f59e0b" opacity="0.12"/>
  <rect x="54" y="105" width="12" height="55" rx="3" fill="#f59e0b" opacity="0.14"/>

  <rect x="134" y="130" width="12" height="30" rx="3" fill="#f59e0b" opacity="0.12"/>
  <rect x="150" y="112" width="12" height="48" rx="3" fill="#f59e0b" opacity="0.12"/>
  <rect x="166" y="97" width="12" height="63" rx="3" fill="#f59e0b" opacity="0.14"/>

  <!-- Main "SD" text -->
  <text
    x="100"
    y="115"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="72"
    font-weight="900"
    letter-spacing="-2"
    fill="url(#goldGrad)"
    filter="url(#glow)"
  >SD</text>

  <!-- Divider line -->
  <line x1="48" y1="128" x2="152" y2="128" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>

  <!-- "comparativo" subtitle -->
  <text
    x="100"
    y="152"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="16"
    font-weight="600"
    letter-spacing="4"
    fill="#fbbf24"
    opacity="0.9"
  >COMPARATIVO</text>

  <!-- Small dot accent -->
  <circle cx="100" cy="170" r="3" fill="#f59e0b" opacity="0.7" filter="url(#glow)"/>
  <circle cx="86" cy="170" r="2" fill="#f59e0b" opacity="0.35"/>
  <circle cx="114" cy="170" r="2" fill="#f59e0b" opacity="0.35"/>
</svg>
